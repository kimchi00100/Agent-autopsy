<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Agent Autopsy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)" opacity="0.6"/>

  <g font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif">
    <text x="80" y="118" font-size="64" font-weight="700" fill="#f8fafc">Agent Autopsy</text>
    <rect x="82" y="138" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="190" font-size="22" fill="#cbd5e1">Make AI coding agents fix the bugs that run but are wrong,</text>
    <text x="80" y="226" font-size="22" fill="#cbd5e1">with execution evidence. Only approved patches land.</text>
    <text x="80" y="290" font-size="17" fill="#64748b">Local · MCP · Electron · TypeScript</text>

    <g font-size="17" font-weight="600" text-anchor="middle">
      <g>
        <rect x="760" y="70" width="190" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
        <text x="855" y="104" fill="#e2e8f0">Report · Incident</text>
      </g>
      <g>
        <rect x="760" y="150" width="190" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
        <text x="855" y="184" fill="#e2e8f0">Collect evidence</text>
      </g>
      <g>
        <rect x="760" y="230" width="190" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
        <text x="855" y="264" fill="#e2e8f0">Verify in worktree</text>
      </g>
      <g>
        <rect x="1000" y="150" width="200" height="56" rx="12" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
        <text x="1100" y="184" fill="#a7f3d0">Apply on approval</text>
      </g>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M855 126V148" marker-end="url(#arrow)"/>
      <path d="M855 206V228" marker-end="url(#arrow)"/>
      <path d="M950 258H975V178H998" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>
